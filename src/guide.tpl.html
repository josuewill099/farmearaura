<!DOCTYPE html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{title}</title>
<meta name="description" content="{desc}">
<link rel="canonical" href="{canonical}">
{hreflang}
<meta name="theme-color" content="#0A0510">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">
<meta property="og:type" content="article">
<meta property="og:locale" content="{oglocale}">
<meta property="og:site_name" content="farmearaura.com">
<meta property="og:title" content="{title}">
<meta property="og:description" content="{desc}">
<meta property="og:url" content="{canonical}">
<meta property="og:image" content="{ogimage}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{ogimage}">
<link rel="preload" href="/fonts/chakra-petch-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{{font-family:'Bungee';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/bungee-400.woff2) format('woff2')}}
@font-face{{font-family:'Chakra Petch';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/chakra-petch-400.woff2) format('woff2')}}
@font-face{{font-family:'Chakra Petch';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/chakra-petch-600.woff2) format('woff2')}}
@font-face{{font-family:'Chakra Petch';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/chakra-petch-700.woff2) format('woff2')}}
@font-face{{font-family:'Share Tech Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/share-tech-mono-400.woff2) format('woff2')}}
</style>
<style>
:root{{
  --void:#0A0510;--ink:#150B22;--panel:#1D1030;
  --aura:#B026FF;--cyan:#00F0FF;--gold:#FFC53D;--blood:#FF2E5B;
  --bone:#EDE6F5;--mid:#9C8AB4;--dim:#7B6A92;
  --display:'Bungee',Impact,sans-serif;
  --body:'Chakra Petch',sans-serif;
  --data:'Share Tech Mono',monospace;
}}
*{{box-sizing:border-box;margin:0;padding:0}}
body{{background:var(--void);color:var(--bone);font-family:var(--body);
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}}
body::before{{content:'';position:fixed;inset:0;pointer-events:none;z-index:90;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}}
.bg{{position:fixed;inset:0;z-index:-1;
  background:radial-gradient(70% 40% at 50% -5%,rgba(176,38,255,.28),transparent 70%),
             radial-gradient(50% 30% at 90% 100%,rgba(0,240,255,.10),transparent 70%)}}
.wrap{{max-width:720px;margin:0 auto;padding:0 22px}}
a{{color:var(--cyan);text-decoration-thickness:1px;text-underline-offset:3px}}

header{{padding:20px 0;border-bottom:1px solid #2A1A3E}}
.logo{{font-family:var(--display);font-size:16px;color:var(--bone);text-decoration:none;
  text-shadow:2px 0 0 var(--aura),-2px 0 0 var(--cyan)}}
.topnav{{display:flex;justify-content:space-between;align-items:center;gap:16px}}
.topnav .cta{{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.16em;
  background:var(--gold);color:#150B22;padding:9px 14px;border-radius:2px;text-decoration:none;white-space:nowrap}}
/* Menu con dropdowns (identico en funcion a duelos.css/app.html, con las
   variables de color de esta plantilla) -- solo se usa cuando navblock trae
   el nav_data.nav_html() rico en vez del CTA simple (por ahora, contador). */
.nav{{display:flex;gap:2px;align-items:center}}
.nav>a,.nav .item>a{{
  display:inline-flex;align-items:center;min-height:38px;
  font-size:13px;font-weight:600;color:var(--mid);text-decoration:none;
  padding:9px 10px;border-radius:999px;
}}
.nav>a:hover,.nav .item>a:hover{{color:var(--bone)}}
.nav>a[aria-current="page"],.nav .item>a[aria-current="page"]{{color:var(--ink);background:var(--bone)}}
.nav .item{{position:relative;display:flex;align-items:center}}
.nav .caret{{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:38px;margin-left:-6px;padding:0;border:0;background:none;
  color:var(--mid);font-size:10px;line-height:1;cursor:pointer;border-radius:999px;
  transition:transform .15s ease,color .15s ease;
}}
.nav .caret:hover{{color:var(--bone)}}
.nav .item.open .caret{{color:var(--bone);transform:rotate(180deg)}}
@media (max-width:480px){{
  .logo{{font-size:11px}}
  .nav{{gap:0}}
  .nav>a,.nav .item>a{{font-size:10px;padding:7px 5px;min-height:34px}}
  .nav .caret{{width:22px;height:34px;margin-left:-9px;font-size:9px}}
}}
.nav .sub{{
  display:none;position:absolute;top:100%;right:0;margin-top:2px;z-index:30;min-width:160px;
  flex-direction:column;gap:2px;padding:6px;border-radius:12px;
  background:var(--panel);border:1px solid #2A1A3E;
}}
.nav .item.open .sub{{display:flex;animation:navsub .15s ease both}}
@media (hover:hover) and (pointer:fine){{
  .nav .item:hover .sub{{display:flex;animation:navsub .15s ease both}}
}}
@keyframes navsub{{from{{opacity:0;transform:translateY(-4px)}}to{{opacity:1;transform:translateY(0)}}}}
.nav .sub a{{
  display:block;padding:11px 12px;border-radius:7px;font-size:13px;font-weight:600;
  color:var(--mid);text-decoration:none;white-space:nowrap;
}}
.nav .sub a:hover{{background:#2A1A3E;color:var(--bone)}}
.nav .sub a[aria-current="page"]{{color:var(--bone);background:#2A1A3E}}

.crumb{{font-family:var(--data);font-size:12px;color:var(--dim);padding:18px 0 0;letter-spacing:.04em}}
.crumb a{{color:var(--dim)}}

h1{{font-family:var(--display);font-size:clamp(30px,7.5vw,46px);line-height:1.05;
  margin:14px 0 18px;letter-spacing:-.01em}}
h2{{font-family:var(--display);font-size:clamp(21px,4.6vw,27px);line-height:1.2;
  margin:52px 0 16px;scroll-margin-top:20px}}
h3{{font-family:var(--body);font-weight:700;font-size:19px;margin:28px 0 8px;color:var(--gold)}}
p{{margin:0 0 16px;color:#D6CBE4}}
strong{{color:var(--bone)}}
.updated{{font-family:var(--data);font-size:12px;color:var(--dim);margin-bottom:26px}}

.answer{{border-left:4px solid var(--gold);background:linear-gradient(100deg,var(--panel),transparent);
  padding:18px 20px;margin:0 0 34px}}
.answer p{{margin:0;font-size:18.5px;color:var(--bone)}}

.toc{{border:1px solid #2A1A3E;padding:18px 20px;margin:0 0 40px;background:rgba(21,11,34,.6)}}
.toc .label{{font-family:var(--data);font-size:11px;letter-spacing:.24em;color:var(--cyan);margin-bottom:10px}}
.toc ol{{margin:0;padding-left:20px;font-size:15.5px}}
.toc li{{margin:5px 0}}

ul.plain{{list-style:none;margin:0 0 20px}}
ul.plain li{{padding:9px 0 9px 26px;position:relative;border-bottom:1px solid #21132F;color:#D6CBE4}}
ul.plain li::before{{content:'▸';position:absolute;left:0;color:var(--aura)}}

/* ledger — el elemento firma */
.ledger{{border:1px solid #2A1A3E;margin:0 0 24px;background:rgba(21,11,34,.55)}}
.ledger .head{{display:flex;justify-content:space-between;font-family:var(--data);font-size:11px;
  letter-spacing:.2em;color:var(--dim);padding:11px 16px;border-bottom:1px solid #2A1A3E}}
.ledger .row{{display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding:12px 16px;border-bottom:1px solid #1C1029;font-size:15.5px}}
.ledger .row:last-child{{border-bottom:0}}
.ledger .v{{font-family:var(--data);font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}}
.up .v{{color:var(--gold)}}
.down .v{{color:var(--blood)}}

dl.glo{{margin:0 0 24px}}
dl.glo dt{{font-family:var(--data);color:var(--cyan);font-size:15px;margin-top:18px;letter-spacing:.03em}}
dl.glo dd{{margin:4px 0 0;color:#D6CBE4}}

details{{border-bottom:1px solid #2A1A3E}}
details summary{{cursor:pointer;list-style:none;padding:16px 30px 16px 0;position:relative;
  font-weight:700;font-size:17px;color:var(--bone)}}
details summary::-webkit-details-marker{{display:none}}
details summary::after{{content:'+';position:absolute;right:2px;top:14px;
  font-family:var(--data);font-size:22px;color:var(--aura)}}
details[open] summary::after{{content:'−'}}
details .a{{padding:0 0 18px;color:#D6CBE4}}
details .a p:last-child{{margin-bottom:0}}

.related{{display:flex;flex-wrap:wrap;gap:10px;margin:44px 0 0}}
.related a{{display:inline-flex;align-items:center;gap:8px;flex:1;min-width:180px;
  border:1px solid #2A1A3E;border-radius:10px;padding:14px 16px;
  font-family:var(--body);font-weight:700;font-size:14.5px;color:var(--bone);
  text-decoration:none;background:rgba(21,11,34,.5)}}
.related a:hover{{border-color:var(--aura)}}
.related a::after{{content:'→';margin-left:auto;color:var(--aura)}}

.promo{{border:2px solid var(--aura);padding:26px 22px;margin:56px 0 0;text-align:center;
  background:linear-gradient(160deg,rgba(176,38,255,.14),transparent)}}
.promo .k{{font-family:var(--display);font-size:22px;line-height:1.15;margin-bottom:8px}}
.promo p{{color:var(--mid);font-size:15px;margin-bottom:18px}}
.promo a{{display:inline-block;background:var(--gold);color:#150B22;font-family:var(--display);
  font-size:14px;padding:15px 26px;text-decoration:none;border-radius:3px;
  box-shadow:0 0 34px rgba(255,197,61,.3)}}

.quiz{{border:2px solid var(--aura);border-radius:4px;padding:24px 22px;margin:0 0 34px;
  background:linear-gradient(160deg,rgba(176,38,255,.14),transparent)}}
.q-bar{{height:4px;background:#2A1A3E;border-radius:2px;overflow:hidden;margin-bottom:10px}}
.q-fill{{height:100%;background:var(--gold);transition:width .3s ease}}
.q-count{{font-family:var(--data);font-size:12px;color:var(--dim);margin-bottom:14px}}
.q-text{{font-family:var(--display);font-size:clamp(18px,4vw,24px);line-height:1.2;margin:0 0 18px}}
.q-opts{{display:flex;flex-direction:column;gap:10px}}
.q-opt{{display:block;width:100%;text-align:left;border:1px solid #2A1A3E;background:rgba(21,11,34,.6);
  color:var(--bone);font-family:var(--body);font-size:15px;padding:14px 16px;border-radius:3px;
  cursor:pointer;transition:border-color .15s ease,background .15s ease}}
.q-opt:hover{{border-color:var(--aura);background:rgba(176,38,255,.12)}}
.q-result{{text-align:center}}
.q-emoji{{font-size:52px;display:block;margin-bottom:10px}}
.q-result h3{{font-family:var(--display);font-size:clamp(20px,5vw,28px);margin:0 0 10px}}
.q-result p{{color:var(--mid);margin:0 0 20px}}
.q-cta{{display:inline-block;background:var(--gold);color:#150B22;font-family:var(--display);
  font-size:13px;padding:13px 22px;text-decoration:none;border-radius:3px;margin:0 8px 10px 0}}
.q-retry{{display:inline-block;background:none;border:1px solid var(--mid);color:var(--mid);
  font-family:var(--body);font-size:13px;padding:12px 20px;border-radius:3px;cursor:pointer}}

.counter{{border:2px solid var(--aura);border-radius:4px;padding:28px 22px;margin:0 0 34px;
  background:linear-gradient(160deg,rgba(176,38,255,.14),transparent);text-align:center}}
.c-label{{font-family:var(--data);font-size:11px;letter-spacing:.24em;color:var(--dim);
  margin-bottom:16px;text-transform:uppercase}}
.c-num{{font-family:var(--data);font-size:clamp(42px,13vw,64px);line-height:1;
  font-variant-numeric:tabular-nums;color:var(--bone);margin-bottom:8px;transition:color .2s ease}}
.c-num.pos{{color:var(--gold)}}
.c-num.neg{{color:var(--blood)}}
.c-num.bump{{animation:cbump .28s ease}}
@keyframes cbump{{0%{{transform:scale(1)}}35%{{transform:scale(1.12)}}100%{{transform:scale(1)}}}}
.c-msg{{min-height:38px;font-size:14.5px;color:var(--mid);margin-bottom:22px}}
.c-btn{{display:block;width:100%;background:var(--gold);color:#150B22;font-family:var(--display);
  font-size:16px;padding:17px 22px;border:0;border-radius:3px;cursor:pointer;
  box-shadow:0 0 34px rgba(255,197,61,.3);margin-bottom:12px}}
.c-btn:active{{transform:scale(.98)}}
.c-presets{{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:16px}}
.c-preset{{background:rgba(21,11,34,.6);border:1px solid #2A1A3E;color:var(--bone);
  font-family:var(--data);font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer;
  transition:border-color .15s ease,background .15s ease}}
.c-preset:hover{{border-color:var(--aura);background:rgba(176,38,255,.12)}}
.c-preset:active{{transform:scale(.94)}}
.c-reset{{display:inline-block;background:none;border:1px solid var(--mid);color:var(--mid);
  font-family:var(--body);font-size:12.5px;padding:10px 18px;border-radius:3px;cursor:pointer}}

.sources{{font-size:14px;color:var(--dim);margin-top:14px}}
.sources li{{margin:6px 0}}
footer{{border-top:1px solid #2A1A3E;margin-top:56px;padding:26px 0 40px;
  font-size:13px;color:var(--dim);text-align:center;line-height:1.9}}
footer a{{color:var(--mid)}}
@media(max-width:480px){{body{{font-size:16.5px}}}}
</style>
<script type="application/ld+json">
{ld}
</script>
{analytics}
</head>
<body>
<div class="bg"></div>

<header><div class="wrap"><div class="topnav">
  <a class="logo" href="{home}">FARMEARAURA</a>
  {navblock}
</div></div></header>

<main class="wrap">
  <p class="crumb"><a href="{home}">{homeLabel}</a> / {h1}</p>

  <h1>{h1}</h1>
  <p class="updated">{meta}</p>

  <div class="answer"><p>{answer}</p></div>

{quizWidget}
  <div class="toc">
    <div class="label">{tocLabel}</div>
{toc}
  </div>

{sections}

  <div class="related">
{related}
  </div>

  <div class="promo">
    <div class="k">{promoK}</div>
    <p>{promoP}</p>
    <a href="{promoUrl}">{promoBtn}</a>
  </div>

  <h2>{sourcesH}</h2>
  <ul class="sources">
{sources}
  </ul>
</main>

<footer><div class="wrap">
  <a href="{home}">{ctaNav}</a> &middot; <a href="{canonical}">{guideLink}</a><br>
{legalLinks}
  {footerNote}
</div></footer>
</body>
</html>
