<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="alternate" hreflang="es" href="{{CANONICAL}}">
<link rel="alternate" hreflang="es-AR" href="{{CANONICAL}}">
<link rel="alternate" hreflang="x-default" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:locale" content="es_AR">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0416">
<style>{{CSS}}</style>
{{JSONLD}}
<!--ANALYTICS-->
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="{{HOME}}">FARMEAR <span>AURA</span></a>
    <nav class="nav">{{NAV}}</nav>
  </header>
  <nav class="duels" aria-label="Otros duelos">{{DUELS}}</nav>

  <main>
    <h1>{{H1}}</h1>
    <p class="sub">{{SUB}}</p>
    <p class="aviso" id="aviso" hidden>{{OFFLINE}}</p>
    {{MAIN}}
  </main>

  <footer>{{FOOTER}}</footer>
</div>
<script>window.DUELOS={{CONFIG}};</script>
<script>{{JS}}</script>
</body>
</html>
